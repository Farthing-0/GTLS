[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gputls"
dynamic = ["version"]
description = "GPU-accelerated Transit Least Squares (TLS) for periodic transit detection"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Quanquan Hu", email = "huqq1917@outlook.com"},
]
maintainers = [
  {name = "Quanquan Hu", email = "huqq1917@outlook.com"},
]
keywords = ["astronomy", "exoplanet", "transit", "TLS", "GPU", "CUDA"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: MIT License",
  "Environment :: GPU :: NVIDIA CUDA",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
# CuPy is not listed because its wheel depends on the local CUDA version;
# install it manually or via the cuda11 / cuda12 extras.
dependencies = [
  "numpy",
  "numba",
  "tqdm",
  "batman-package",
]

[project.optional-dependencies]
cuda11 = ["cupy-cuda11x"]
cuda12 = ["cupy-cuda12x"]
test = ["pytest", "astropy"]

[project.urls]
Homepage = "https://github.com/Farthing-0/GTLS"
Source = "https://github.com/Farthing-0/GTLS"
Issues = "https://github.com/Farthing-0/GTLS/issues"

[tool.setuptools.dynamic]
version = {attr = "gputls.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gputls = ["kernels.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
